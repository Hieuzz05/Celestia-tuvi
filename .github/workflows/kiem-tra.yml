# Cổng tự động cho mọi lần đẩy nhánh và mọi PR vào main.
# Chỉ chạy các bài kiểm OFFLINE: không cần khoá, không gọi model, không chạm
# database — nên không cần secret nào và không tốn tiền. Các bài chạm DB thật
# hoặc model thật (test-hoi-thoai, eval-chat-quyet-dinh, test-rag-toan-tuyen)
# vẫn chạy tay theo AGENTS.md.
name: Kiem tra

on:
  push:
    branches: ['**']
    paths-ignore: ['TRANG-THAI.md', '**/*.xlsx']
  pull_request:
    branches: [main]

concurrency:
  group: kiem-tra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # LayoutProps / PageProps là kiểu toàn cục Next sinh vào .next/types — máy dev có sẵn
      # nhờ next dev, CI chạy từ kho sạch thì phải sinh trước, không tsc báo thiếu tên
      - name: Sinh kiểu route
        run: npx next typegen
      - name: Kiểu (tsc)
        run: npx tsc --noEmit
      - name: Lint không vượt mốc
        run: node scripts/dem-loi-lint.mjs

      - name: Engine an sao
        run: npx tsx scripts/test-ansao-chuan.ts
      - name: Planner RAG
        run: npx tsx scripts/test-rag-planner.ts
      - name: Bộ vàng planner
        run: npx tsx scripts/eval-planner.ts
      - name: Chuẩn ngôn ngữ
        run: npx tsx scripts/test-chuan-ngon-ngu.ts
      - name: Cách cục
        run: npx tsx scripts/test-cach-cuc.ts
      - name: Bài luận 12 cung
        run: npx tsx scripts/test-12-cung.ts
      - name: Bối cảnh người đọc + cấu hình luận giải
        run: npx tsx scripts/test-boi-canh-doc.ts
      - name: Độ phủ dữ kiện (mọi sao, xung chiếu)
        run: npx tsx scripts/test-phu-du-kien.ts
      - name: Lớp an toàn chat (bắt đúng, không bắt nhầm)
        run: npx tsx scripts/test-an-toan.ts
      - name: Hợp đồng trả lời (không chạm kết luận, thứ tự khối)
        run: npx tsx scripts/test-hop-dong-tra-loi.ts
      - name: Lớp sửa câu không làm sập xuống dòng
        run: npx tsx scripts/test-sua-chua-tach.ts
      - name: Hạn lưu nhật ký (xoá đệm chung luôn lọc be_mat)
        run: npx tsx scripts/test-han-luu-nhat-ky.ts
      - name: Dấu ấn Celes — cổng, chống lặp, đầu-cuối trên văn cuối
        run: npx tsx scripts/test-dau-an.ts
      - name: Dấu ấn Celes — độ phủ thư viện và cổng (UNREACHABLE = 0)
        run: npx tsx scripts/do-coverage-dau-an.ts
      - name: Linh vật nghiêm theo lượt mới nhất (không dính)
        run: npx tsx scripts/test-linh-vat-an-toan.ts
      - name: Chỗ đặt linh vật (mục 12, ảnh khoá, vùng nội dung)
        run: npx tsx scripts/test-cho-dat-celes.ts
      - name: Dữ kiện phần đang hỏi (nghiêng về, mốc, cờ Focused tắt)
        run: npx tsx scripts/test-du-kien.ts
      - name: Đường Focused — cờ tắt giữ STANDARD, guard, câu mã, phần nối
        run: npx tsx scripts/test-focused.ts
      - name: CEL-191 hiểu câu theo trường — bảng timeIntent, cổng gọi model, gộp luật trước
        run: npx tsx scripts/test-hieu-cau-truong.ts
      - name: CEL-196 nghiệm lý — chỉ mục celes, đang dùng, phiên bản đã duyệt mới vào chat
        run: npx tsx scripts/test-nghiem-ly.ts
      - name: CEL-195 phản hồi 👍👎 — nhãn đóng, chỉ lượt của chính mình, Cần duyệt chỉ dữ liệu an toàn
        run: npx tsx scripts/test-phan-hoi.ts
      - name: P0 §14 độ phủ tầng viết — hàm đếm claim/F/điểm bắt buộc
        run: npx tsx scripts/test-do-phu-viet.ts
      - name: Lối dừng bằng mã — chỉ dữ kiện, hỏi lại không tính lượt, một ngoại lệ tạm
        run: npx tsx scripts/test-loi-chi-ma.ts
      - name: Đóng băng chonBoiCanh + cờ tắt không có meta (CEL-186 A0)
        run: npx tsx scripts/test-boi-canh-dong-bang.ts
      - name: Behavior Contract offline — người / ý / thời gian 30 flow (CEL-186 v2)
        run: npx tsx scripts/test-hop-dong-focused.ts
      - name: PRIV-01 — trace Production không giữ câu hỏi, truy vấn, văn validator, băm lá số
        run: npx tsx scripts/test-priv-01.ts
      - name: Lõi chẩn đoán P0 — tầng hỏng sớm nhất, cờ không dừng chẩn đoán, nhãn ngoài
        run: npx tsx scripts/test-p0-chan-doan.ts
      - name: Hiểu câu qua lượt — meta ký, dựng lại F###, hỏi lại lá số của ai, giải thích lượt trước (CEL-186 v2 F)
        run: npx tsx scripts/test-hieu-cau.ts
      - name: fallback.ts giữ nguyên khi không đặt biến eval (vùng Chung)
        run: npx tsx scripts/test-fallback-giu-nguyen.ts
      - name: Đệm AI tách theo môi trường (prod / Preview / local, cấu hình chỉ prod ghi)
        run: npx tsx scripts/test-moi-truong-dem.ts

      - name: Build
        run: npx next build
